# WAF stub — reverse proxy. À durcir : Coraza/ModSecurity + OWASP CRS,
# rate-limiting (limit_req), blocage des patterns d'injection.
server {
    listen 80;
    # limit_req_zone à activer pour la défense DoS applicative (P1)
    location / {
        proxy_pass http://payment-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
