groups:
  - name: resilience-alpha
    rules:
      # Indisponibilité d'une cible (ex: conteneur tombé)
      - alert: ServiceDown
        expr: up{job="payment-api"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          action: restart            # consommé par remediation-engine
          target: payment-api        # nom de conteneur ciblé
          summary: "payment-api indisponible"

      # Taux d'erreurs 5xx élevé (signature DoS / saturation)
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[30s]))
          / sum(rate(http_requests_total[30s])) > 0.25
        for: 15s
        labels:
          severity: warning
        annotations:
          action: restart
          target: payment-api
          summary: "Taux de 5xx > 25% sur payment-api"

      # Anomalie ML (gauge exposée par ml-detector). Seuil à calibrer par Mahalia.
      - alert: AnomalyDetected
        expr: anomaly_score > 0.8
        for: 10s
        labels:
          severity: critical
        annotations:
          action: restart
          target: payment-api
          summary: "Score d'anomalie ML élevé"

      # Latence p95 élevée (signature DoS mesurée : payment-api met en file au lieu
      # de renvoyer des 5xx, donc HighErrorRate ne déclenche pas ; p95 0,022 s -> 0,66 s)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(request_latency_seconds_bucket[30s])) by (le)) > 0.5
        for: 15s
        labels:
          severity: critical
        annotations:
          action: restart
          target: payment-api
          summary: "Latence p95 > 0.5s sur payment-api (signature DoS)"
