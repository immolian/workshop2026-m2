# =============================================================================
# PROJECT RESILIENCE-ALPHA — Orchestration du démonstrateur
# Source de vérité unique du déploiement. `docker compose up` doit suffire.
#
# Segmentation réseau (principe : publier avec discernement) :
#   - edge-net     : seul réseau atteignable depuis l'hôte (WAF + dashboards)
#   - backend-net  : INTERNE (internal:true) — DB, API, secrets, remédiation.
#                    Aucune interface interne n'est exposée au réseau pédagogique.
# =============================================================================

networks:
  edge-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true          # aucune route vers l'extérieur : DB/secrets protégés

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ---------------------------------------------------------------------------
  # SI DE PAIEMENT (support métier — volontairement minimal)
  # ---------------------------------------------------------------------------

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_sops}
      POSTGRES_DB: ${POSTGRES_DB:-payment}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net          # jamais de port publié sur l'hôte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payment}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth:
    build: ./services/auth
    container_name: auth
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  payment-api:
    build: ./services/payment-api
    container_name: payment-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payment}:${POSTGRES_PASSWORD:-changeme_in_sops}@db:5432/${POSTGRES_DB:-payment}
      AUTH_URL: http://auth:8000
    networks:
      - backend-net          # atteignable UNIQUEMENT via le WAF, pas depuis l'hôte
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WAF — unique point d'entrée applicatif exposé (Axe cybersécurité)
  # Stub reverse-proxy. À remplacer par Coraza/ModSecurity + règles OWASP CRS.
  # ---------------------------------------------------------------------------
  waf:
    image: nginx:1.27-alpine
    container_name: waf
    ports:
      - "8080:80"            # SEULE entrée applicative publiée
    volumes:
      - ./services/frontend/waf-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge-net
      - backend-net
    depends_on:
      - payment-api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OBSERVABILITÉ
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - backend-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - backend-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lecture seule : collecte des logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - backend-net
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"          # dashboard observé par le jury
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - edge-net
      - backend-net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # IA / DATA
  # ---------------------------------------------------------------------------

  ml-detector:
    build: ./services/ml-detector
    container_name: ml-detector
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    networks:
      - backend-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # rag-assistant : P1 — décommenter quand le socle tourne
  # rag-assistant:
  #   build: ./services/rag-assistant
  #   container_name: rag-assistant
  #   environment:
  #     OLLAMA_URL: http://host.docker.internal:11434   # Ollama sur l'hôte/VLAN IA
  #   networks:
  #     - backend-net
  #   restart: unless-stopped

  # ---------------------------------------------------------------------------
  # REMÉDIATION AUTONOME (chemin critique — Axe 1)
  # Accès Docker JAMAIS en direct : passe par un proxy à périmètre restreint.
  # ---------------------------------------------------------------------------

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1          # lecture de l'état des conteneurs
      POST: 1                # autorise POST (restart) — cf. note sécurité README
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0                # pas d'exec : on ne veut pas d'un shell distant
      INFO: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net
    restart: unless-stopped

  remediation-engine:
    build: ./services/remediation-engine
    container_name: remediation-engine
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DRY_RUN: ${DRY_RUN:-true}        # true = log seulement (défaut sûr J1)
      AUTH_URL: http://auth:8000       # login du canari (JWT exigé par payment-api)
      CANARY_USER: ${CANARY_USER:-demo}
      CANARY_PASSWORD: ${CANARY_PASSWORD:-demo123}
    networks:
      - backend-net
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
